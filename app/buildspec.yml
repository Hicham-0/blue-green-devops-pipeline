version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "=== Installation des dépendances ==="
      - cd app
      - npm ci
      - echo "=== Installation de Trivy ==="
      - wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

  pre_build:
    commands:
      - echo "=== Authentification à ECR ==="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - echo "=== Exécution des tests unitaires ==="
      - npm test

      - echo "=== Calcul du tag de l'image (SHA du commit) ==="
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - echo "Image taguée avec $IMAGE_TAG"

  build:
    commands:
      - echo "=== Construction de l'image Docker ==="
      - docker build -t $ECR_REPOSITORY_URL:$IMAGE_TAG .

      - echo "=== Scan de sécurité Trivy ==="
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $ECR_REPOSITORY_URL:$IMAGE_TAG

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "=== Scan Trivy OK, push de l'image vers ECR ==="
          docker push $ECR_REPOSITORY_URL:$IMAGE_TAG
          echo "=== Push terminé avec succès ==="
        else
          echo "=== Phase Build échoué, push ANNULÉ ==="
          exit 1
        fi